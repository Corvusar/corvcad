workflows:
  freecad-ios: &freecad-ios
    name: FreeCAD F3 static iOS validation
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment: &freecad-ios-environment
      xcode: latest
      vars: &freecad-ios-variables
        FREECAD_SDK: iphonesimulator
        FREECAD_STAGE: full
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        CCACHE_MAXSIZE: 512M
    # Manual only, using the separate FreeCAD Codemagic app/account.
    # Prime each SDK workflow with FREECAD_STAGE=inputs, then run full.
    # Codemagic keeps the first successful cache until explicitly revoked or
    # expired; later successful stages do not update an existing cache.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build/freecad-ios/binary-cache
        - $CM_BUILD_DIR/build/freecad-ios/ccache-ios
        - $CM_BUILD_DIR/build/freecad-ios/python/Python-3.13.7
        - $CM_BUILD_DIR/build/freecad-ios/python/Python-3.13.7.tar.xz
        - $CM_BUILD_DIR/build/freecad-ios/python/host
        - $CM_BUILD_DIR/build/freecad-ios/occt/OCCT-V7_8_1.tar.gz
        - $CM_BUILD_DIR/build/freecad-ios/occt/OCCT-7_8_1
        - $CM_BUILD_DIR/build/freecad-ios/occt/iphonesimulator
        - $CM_BUILD_DIR/build/freecad-ios/occt/iphoneos
    scripts:
      - name: Record target and install host generators
        script: |
          set -euo pipefail
          case "$FREECAD_SDK" in
            iphonesimulator) triplet=arm64-ios-simulator ;;
            iphoneos) triplet=arm64-ios ;;
            *) echo "Unsupported FreeCAD SDK"; exit 2 ;;
          esac
          case "$FREECAD_STAGE" in dependencies|inputs|full|session) ;; *) exit 2 ;; esac
          test "$(uname -m)" = arm64
          mkdir -p build/freecad-ios
          echo "FREECAD_TRIPLET=$triplet" >> "$CM_ENV"
          echo "CCACHE_DIR=$CM_BUILD_DIR/build/freecad-ios/ccache-ios" >> "$CM_ENV"
          echo "CCACHE_BASEDIR=$CM_BUILD_DIR" >> "$CM_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$CM_BUILD_DIR/build/freecad-ios/binary-cache,readwrite" >> "$CM_ENV"
          brew install autoconf autoconf-archive automake libtool pkgconf ninja cmake ccache swig bison flex
          if [ "$FREECAD_STAGE" = session ]; then brew install xcodegen; fi
          echo "PATH=$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH" >> "$CM_ENV"
          sw_vers
          xcodebuild -version
          xcrun --sdk "$FREECAD_SDK" --show-sdk-version
          xcrun simctl list runtimes
          python3 -c 'import json,os,subprocess; json.dump({"schema":1,"scope":os.environ["FREECAD_STAGE"],"sdk":os.environ["FREECAD_SDK"],"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()},open("build/freecad-ios/codemagic-job.json","w"),indent=2)'
      - name: Source and runtime boundary regressions
        script: |
          set -euo pipefail
          python3 -m unittest discover -s integrations/freecad_core/ios -v
          if [ "$FREECAD_STAGE" = session ]; then
            python3 -m unittest discover -s integrations/freecad_core/session -p test_package.py -v
            cmake -S engine -B build/engine-f4 -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build/engine-f4 --parallel 3
            ctest --test-dir build/engine-f4 --output-on-failure
          fi
      - name: Static target dependencies and actual SDK inventory
        script: |
          set -euo pipefail
          bash integrations/freecad_core/ios/deps.sh build/freecad-ios/deps "$FREECAD_TRIPLET" > dependencies-build.log 2>&1 || { tail -100 dependencies-build.log; exit 1; }
          python3 integrations/freecad_core/ios/dependency_inventory.py build/freecad-ios/deps/installed "$FREECAD_TRIPLET" "build/freecad-ios/deps/inventory-$FREECAD_TRIPLET.json" --verify-target
      - name: CPython using the same target dependency archives
        script: |
          set -euo pipefail
          if [ "$FREECAD_STAGE" = dependencies ]; then echo "Dependencies-only cache checkpoint; no Python result"; exit 0; fi
          python3 integrations/freecad_core/ios/build_python.py --sdk "$FREECAD_SDK" --deps "build/freecad-ios/deps/installed/$FREECAD_TRIPLET" --jobs 3 > python-build.log 2>&1 || { tail -100 python-build.log; exit 1; }
          bash integrations/freecad_core/ios/probe.sh build/freecad-ios/python "$FREECAD_SDK" "build/freecad-ios/deps/installed/$FREECAD_TRIPLET"
      - name: Static OCCT geometry and STEP closure
        script: |
          set -euo pipefail
          if [ "$FREECAD_STAGE" = dependencies ]; then echo "Dependencies-only cache checkpoint; no OCCT result"; exit 0; fi
          python3 integrations/freecad_core/ios/build_occt.py --sdk "$FREECAD_SDK" --jobs 3 > occt-build.log 2>&1 || { tail -100 occt-build.log; exit 1; }
          ccache --show-stats > occt-cache-stats.txt
          cat occt-cache-stats.txt
      - name: Compile FreeCAD for the target SDK
        script: |
          set -euo pipefail
          case "$FREECAD_STAGE" in full|session) ;; *) echo "Inputs-only validation; FreeCAD compile not requested"; exit 0 ;; esac
          if [ "$FREECAD_STAGE" = session ]; then
            python3 integrations/freecad_core/session/build.py --sdk "$FREECAD_SDK" --jobs 3 > freecad-ios-build.log 2>&1 || { tail -120 freecad-ios-build.log; exit 1; }
          else
            python3 integrations/freecad_core/ios/cross.py --sdk "$FREECAD_SDK" --jobs 3 > freecad-ios-build.log 2>&1 || { tail -120 freecad-ios-build.log; ccache --show-stats; exit 1; }
          fi
      - name: Stage reviewed resources and validate the runtime
        script: |
          set -euo pipefail
          case "$FREECAD_STAGE" in full|session) ;; *) echo "Inputs-only validation; no runtime result"; exit 0 ;; esac
          python3 integrations/freecad_core/ios/stage_runtime.py \
            --source build/freecad-ios/source-ios/FreeCAD \
            --build "build/freecad-ios/freecad-$FREECAD_SDK" \
            --python-stage "build/freecad-ios/python/$FREECAD_SDK/stage" \
            --host-python build/freecad-ios/python/host/python.exe \
            --output "build/freecad-ios/runtime-$FREECAD_SDK" \
            --dependency-notices "build/freecad-ios/deps/installed/$FREECAD_TRIPLET/share" \
            --dependency-notices "build/freecad-ios/occt/$FREECAD_SDK/stage/share/occt"
          python3 integrations/freecad_core/ios/run_ios.py --runtime "build/freecad-ios/runtime-$FREECAD_SDK" --sdk "$FREECAD_SDK" --output build/freecad-ios/ios-evidence
      - name: Native mechanical session and app edition (F4)
        script: |
          set -euo pipefail
          [ "$FREECAD_STAGE" = session ] || { echo "F4 session validation not requested"; exit 0; }
          case "$FREECAD_SDK" in iphonesimulator) target=sim ;; iphoneos) target=device ;; esac
          python3 integrations/freecad_core/session/package.py --sdk "$FREECAD_SDK" --output "build/freecad-ios/package/$target"
          python3 integrations/freecad_core/session/run.py --sdk "$FREECAD_SDK" --package "$PWD/build/freecad-ios/package" --output build/freecad-ios/f4-evidence
    artifacts:
      - dependencies-build.log
      - python-build.log
      - occt-build.log
      - occt-cache-stats.txt
      - freecad-ios-build.log
      - build/freecad-ios/codemagic-job.json
      - build/freecad-ios/deps/inventory-*.json
      - build/freecad-ios/deps/vcpkg/buildtrees/**/*.log
      - build/freecad-ios/python/*/*.json
      - build/freecad-ios/python/*/config.log
      - build/freecad-ios/occt/*/*.json
      - build/freecad-ios/occt/*/build/CMakeCache.txt
      - build/freecad-ios/freecad-*/*.json
      - build/freecad-ios/freecad-*/CMakeCache.txt
      - build/freecad-ios/freecad-*/.cmake/api/v1/reply/**
      - build/freecad-ios/runtime-*/runtime-manifest.json
      - build/freecad-ios/runtime-*/notices/**
      - build/freecad-ios/ios-evidence/**
      - build/freecad-ios/package/*/package-manifest.json
      - build/freecad-ios/f4-evidence/*.json
      - build/freecad-ios/f4-evidence/*.txt
      - build/freecad-ios/f4-evidence/*.log
      - build/freecad-ios/f4-evidence/demo/*
      - build/freecad-ios/f4-evidence/roundtrip/*

  freecad-ios-device:
    <<: *freecad-ios
    name: FreeCAD F3 static device validation
    environment:
      <<: *freecad-ios-environment
      vars:
        <<: *freecad-ios-variables
        FREECAD_SDK: iphoneos

  ipad-unsigned:
    name: CorvCAD iPad unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    # No triggering block: builds start only by hand in Codemagic (owner's decision 2026-10-24).
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec app/project.yml
      - name: Build unsigned iPadOS app
        script: |
          set -euo pipefail
          xcodebuild \
            -project app/CorvCAD.xcodeproj \
            -scheme CorvCAD \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          app="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/CorvCAD.app"
          test -d "$app"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$app" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -qr CorvCAD-unsigned.ipa Payload
          unzip -t CorvCAD-unsigned.ipa
    artifacts:
      - build/CorvCAD-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
      - /tmp/xcodebuild_logs/*.log

  # Engine tests, then default-edition screenshots of KiCad's ecc83 schematic in an iPad
  # simulator (portrait and landscape). No IPA. Manual only.
  ui-screens:
    name: CorvCAD engine tests and schematic screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Engine tests
        script: |
          set -euo pipefail
          brew install cmake ninja xcodegen || true
          cmake -G Ninja -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/engine
          ctest --test-dir build/engine --output-on-failure
      - name: Schematic screenshots (iPad simulator)
        script: |
          set -euo pipefail
          (cd app && xcodegen generate -q)
          SIM=$(xcrun simctl list devices available | grep -m1 'iPad Pro 13' | grep -oE '[0-9A-F-]{36}')
          echo "simulator $SIM"
          mkdir -p build/screens
          xcodebuild build-for-testing -project app/CorvCAD.xcodeproj -scheme CorvCAD -destination "id=$SIM" \
            -derivedDataPath build/DerivedData > build/ui-build.log 2>&1 \
            || { grep -E 'error:' build/ui-build.log | head -30; exit 1; }
          xcrun simctl boot "$SIM" || true; xcrun simctl bootstatus "$SIM" -b > /dev/null
          xcrun simctl install "$SIM" build/DerivedData/Build/Products/Debug-iphonesimulator/CorvCAD.app
          DATA=$(xcrun simctl get_app_container "$SIM" org.corvcad.CorvCAD data)
          git clone -q --filter=blob:none --depth 1 --branch 10.0.6 --sparse https://gitlab.com/kicad/code/kicad.git build/kicad-demos
          git -C build/kicad-demos sparse-checkout set demos/ecc83
          mkdir -p "$DATA/Documents/Projects/ecc83-pp" && cp -R build/kicad-demos/demos/ecc83/. "$DATA/Documents/Projects/ecc83-pp/"
          mkdir -p "$DATA/Documents/Gerbers/RoundTrip" && cp engine/tests/fixtures/gerber/RoundTrip-* "$DATA/Documents/Gerbers/RoundTrip/"
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/build/screens" xcodebuild test-without-building \
            -project app/CorvCAD.xcodeproj -scheme CorvCAD -destination "id=$SIM" -derivedDataPath build/DerivedData \
            -only-testing:CorvCADUITests/ScreenshotTests/testCaptureSchematic \
            -only-testing:CorvCADUITests/ScreenshotTests/testCaptureDrawing \
            -only-testing:CorvCADUITests/ScreenshotTests/testCaptureLibraries \
            -only-testing:CorvCADUITests/ScreenshotTests/testCaptureTools > build/ui-test.log 2>&1 \
            || { grep -E 'error|failed|XCTAssert' build/ui-test.log | head -30; exit 1; }
          ls -l build/screens
    artifacts:
      - build/screens/*.png
      - build/ui-build.log
      - build/ui-test.log

  # NATIVE_KICAD edition with the gate 4 diagnostics hook, arm64 device only, from scratch (the
  # same steps as .circleci/config.yml's native-ipa job). Manual only. The iOS libraries
  # (wxWidgets, vcpkg) are compiled once and cached; macOS-side configure inputs are Homebrew bottles.
  native-kicad-diagnostics:
    name: CorvCAD KiCad edition (gate 4 diagnostics) unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build/kicad-core
        - $CM_BUILD_DIR/build/wx-ios
        - $CM_BUILD_DIR/build/ios-deps/installed
        - $CM_BUILD_DIR/build/ngspice
    scripts:
      - name: Host
        script: |
          sw_vers; xcodebuild -version; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h .
          date +%s > /tmp/start
      - name: Homebrew bottles (probe configure inputs and tools)
        script: |
          # Post-install hooks (font caches, certificates) can fail on the runner and make brew exit 1;
          # the build needs only the files, so check that every formula is installed instead.
          PKGS="cmake ninja xcodegen pkgconf python@3.13 wxwidgets boost zstd freetype harfbuzz fontconfig libgit2 protobuf unixodbc cairo pixman"
          brew install $PKGS || true
          brew list --versions $PKGS
      - name: KiCad 10.0.6 source with the patch series, checked against the gate 1 inventory
        script: |
          set -euo pipefail
          # The cache is not keyed to upstream.json: a checkout from before a patch change fails
          # verification, and is then fetched again.
          [ -d build/kicad-core/kicad ] && python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad \
            || { rm -rf build/kicad-core/kicad; python3 integrations/kicad_core/fetch.py --output build/kicad-core --source-only;
                 python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad; }
      - name: ngspice for macOS and arm64 iOS (cached)
        script: |
          set -euo pipefail
          # KiCad's simulator: the mac build for the probe configure (and its code-model generator),
          # the device library for the package. Not keyed to ngspice_ios.sh: delete the cache after
          # changing it.
          [ -f build/ngspice/build-mac/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice mac
          [ -f build/ngspice/build-device/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice device
      - name: Probe configure and measured closures
        script: |
          set -euo pipefail
          cmake -G Ninja -S integrations/kicad_core/probe -B build/kicad-probe -DNGSPICE_BUILD="$PWD/build/ngspice" \
            -DKICAD_SOURCE="$PWD/build/kicad-core/kicad" -DCMAKE_BUILD_TYPE=Release > build/configure.log 2>&1 \
            || { tail -40 build/configure.log; exit 1; }
          python3 - "$PWD" <<'EOF'
          import json, sys
          repo = sys.argv[1].lstrip("/")
          profiles = json.load(open("integrations/kicad_core/audit/sources.json"))["profiles"]
          def unit(path):
              head, _, rest = path.partition("/")
              return {"kicad": rest, "generated": path, "corvcad": f"{repo}/{rest}"}[head]
          for profile, name in (("schematic", "probe_headless"), ("session", "session"), ("board", "pcb_probe_headless"), ("native", "native")):
              with open(f"build/kicad-probe/{name}.closure.txt", "w") as out:
                  out.write("\n".join(sorted(unit(p) for p in profiles[profile]["closure"])) + "\n")
              print(name, len(profiles[profile]["closure"]), "units")
          EOF
      - name: wxWidgets for iphoneos (cached)
        script: |
          set -euo pipefail
          [ -x build/wx-ios/build-device/wx-config ] || bash integrations/kicad_core/wx_ios.sh build/wx-ios device
      - name: vcpkg dependencies for arm64-ios (cached)
        script: |
          set -euo pipefail
          [ -d build/ios-deps/installed/arm64-ios/lib ] || bash integrations/kicad_core/ios_deps.sh build/ios-deps arm64-ios
      - name: Compile the session and board closures for arm64 iOS
        script: |
          set -uo pipefail
          IOS_TARGET=device bash integrations/kicad_core/probe/ios_sweep.sh build/kicad-probe \
            build/wx-ios/build-device "$(sysctl -n hw.ncpu)" build/ios-deps/installed/arm64-ios
          [ ! -f build/kicad-probe/ios_sweep-device/failed.txt ] || { cat build/kicad-probe/ios_sweep-device/first_errors.txt; exit 1; }
      - name: KiCad 10.0.6 symbol and footprint libraries, packed (cached)
        script: |
          set -euo pipefail
          [ -f build/kicad-core/footprints-packed/index.json ] && [ -f build/kicad-core/symbols-packed/index.json ] \
            && [ -f build/kicad-core/symbols-packed/Simulation_SPICE.sp ] \
              || python3 integrations/kicad_core/fetch.py --output build/kicad-core --libraries-only
          du -sh build/kicad-core/symbols-packed build/kicad-core/footprints-packed
      - name: Package and build the unsigned NATIVE_KICAD IPA with the diagnostics hook
        script: |
          set -euo pipefail
          TARGETS=device bash integrations/kicad_core/probe/ios_package.sh build/kicad-probe build/wx-ios build/ios-deps/installed
          (cd app && xcodegen generate -q)
          xcodebuild build -project app/CorvCAD.xcodeproj -scheme CorvCAD -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            NATIVE_KICAD=YES KICAD_PACKAGE="$PWD/build/kicad-probe/package" CODE_SIGNING_ALLOWED=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) CORVCAD_DIAGNOSTICS' > build/xcodebuild.log 2>&1 \
            || { grep -E 'error:' build/xcodebuild.log | head -40; tail -20 build/xcodebuild.log; exit 1; }
          mkdir -p build/out/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/CorvCAD.app build/out/Payload/
          REV=$(git rev-parse --short=12 HEAD)
          (cd build/out && zip -qr "CorvCAD-KiCad-$REV-diagnostics-unsigned.ipa" Payload && rm -rf Payload)
          ls -l build/out
          echo "total build seconds: $(( $(date +%s) - $(cat /tmp/start) ))"
    artifacts:
      - build/out/*.ipa
      - build/xcodebuild.log
      - build/configure.log
      - build/ios-deps/install-arm64-ios.log
      - build/kicad-probe/ios_sweep-device/first_errors.txt

  # The NATIVE_KICAD app in an arm64 iPad simulator with NativeKiCadTests (the same steps as
  # .circleci/config.yml's native-sim job), and the simulator's Stop through the session.
  native-sim:
    name: KiCad edition in the iPad simulator (NativeKiCadTests)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        SIM_ARCH: arm64
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build/kicad-core
        - $CM_BUILD_DIR/build/wx-ios
        - $CM_BUILD_DIR/build/ios-deps/installed
        - $CM_BUILD_DIR/build/ngspice
    scripts:
      - name: Host
        script: |
          sw_vers; xcodebuild -version; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h .
          date +%s > /tmp/start
      - name: Homebrew bottles (probe configure inputs and tools)
        script: |
          PKGS="cmake ninja xcodegen pkgconf python@3.13 wxwidgets boost glm zstd freetype harfbuzz fontconfig libgit2 protobuf unixodbc cairo pixman"
          brew install $PKGS || true
          brew list --versions $PKGS
      - name: KiCad 10.0.6 source with the patch series, checked against the gate 1 inventory
        script: |
          set -euo pipefail
          [ -d build/kicad-core/kicad ] && python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad \
            || { rm -rf build/kicad-core/kicad; python3 integrations/kicad_core/fetch.py --output build/kicad-core --source-only;
                 python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad; }
      - name: ngspice for macOS and the arm64 simulator (cached)
        script: |
          set -euo pipefail
          [ -f build/ngspice/build-mac/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice mac
          [ -f build/ngspice/build-sim/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice sim
      - name: Probe configure and measured closures
        script: |
          set -euo pipefail
          cmake -G Ninja -S integrations/kicad_core/probe -B build/kicad-probe -DNGSPICE_BUILD="$PWD/build/ngspice" \
            -DKICAD_SOURCE="$PWD/build/kicad-core/kicad" -DCMAKE_BUILD_TYPE=Release > build/configure.log 2>&1 \
            || { tail -40 build/configure.log; exit 1; }
          python3 - "$PWD" <<'EOF'
          import json, sys
          repo = sys.argv[1].lstrip("/")
          profiles = json.load(open("integrations/kicad_core/audit/sources.json"))["profiles"]
          def unit(path):
              head, _, rest = path.partition("/")
              return {"kicad": rest, "generated": path, "corvcad": f"{repo}/{rest}"}[head]
          for profile, name in (("schematic", "probe_headless"), ("session", "session"), ("board", "pcb_probe_headless"), ("native", "native")):
              with open(f"build/kicad-probe/{name}.closure.txt", "w") as out:
                  out.write("\n".join(sorted(unit(p) for p in profiles[profile]["closure"])) + "\n")
          EOF
      - name: wxWidgets for the arm64 simulator (cached)
        script: |
          set -euo pipefail
          [ -x build/wx-ios/build-sim/wx-config ] || bash integrations/kicad_core/wx_ios.sh build/wx-ios sim
      - name: vcpkg dependencies for arm64-ios-simulator (cached)
        script: |
          set -euo pipefail
          # GitHub's source archives can fail with 504; vcpkg keeps what it has built, so try again.
          for attempt in 1 2 3 4 5; do
            bash integrations/kicad_core/ios_deps.sh build/ios-deps arm64-ios-simulator && exit 0
            echo "attempt $attempt failed"; sleep 60
          done
          exit 1
      - name: Compile the session and board closures for the arm64 simulator
        script: |
          set -uo pipefail
          IOS_TARGET=sim bash integrations/kicad_core/probe/ios_sweep.sh build/kicad-probe \
            build/wx-ios/build-sim "$(sysctl -n hw.ncpu)" build/ios-deps/installed/arm64-ios-simulator
          [ ! -f build/kicad-probe/ios_sweep/failed.txt ] || { cat build/kicad-probe/ios_sweep/first_errors.txt; exit 1; }
      - name: KiCad 10.0.6 symbol and footprint libraries, packed (cached)
        script: |
          set -euo pipefail
          [ -f build/kicad-core/footprints-packed/index.json ] && [ -f build/kicad-core/symbols-packed/index.json ] \
            && [ -f build/kicad-core/symbols-packed/Simulation_SPICE.sp ] \
              || python3 integrations/kicad_core/fetch.py --output build/kicad-core --libraries-only
      - name: Package and build the NATIVE_KICAD app and tests for the simulator
        script: |
          set -euo pipefail
          TARGETS=sim bash integrations/kicad_core/probe/ios_package.sh build/kicad-probe build/wx-ios build/ios-deps/installed
          (cd app && xcodegen generate -q)
          SIM=$(xcrun simctl list devices available | grep -m1 'iPad Pro 11' | grep -oE '[0-9A-F-]{36}')
          echo "simulator $SIM"; echo "SIM=$SIM" >> "$CM_ENV"
          xcodebuild build-for-testing -project app/CorvCAD.xcodeproj -scheme CorvCAD -destination "id=$SIM" \
            -derivedDataPath build/DerivedData NATIVE_KICAD=YES KICAD_PACKAGE="$PWD/build/kicad-probe/package" \
            KICAD_SYMBOLS="$PWD/build/kicad-core/symbols-packed" KICAD_FOOTPRINTS="$PWD/build/kicad-core/footprints-packed" \
            ENABLE_DEBUG_DYLIB=NO ENABLE_TESTABILITY=NO CODE_SIGNING_ALLOWED=NO \
            > build/ui-build.log 2>&1 || { grep -E 'error:' build/ui-build.log | head -40; tail -20 build/ui-build.log; exit 1; }
      - name: NativeKiCadTests and the simulator's Stop
        script: |
          set -euo pipefail
          mkdir -p build/screens
          xcrun simctl boot "$SIM" || true; xcrun simctl bootstatus "$SIM" -b > /dev/null
          xcrun simctl install "$SIM" build/DerivedData/Build/Products/Debug-iphonesimulator/CorvCAD.app
          DATA=$(xcrun simctl get_app_container "$SIM" org.corvcad.CorvCAD data)
          git clone -q --filter=blob:none --depth 1 --branch 10.0.6 --sparse https://gitlab.com/kicad/code/kicad.git build/kicad-demos
          git -C build/kicad-demos sparse-checkout set demos/ecc83 demos/simulation/rectifier qa/data/pcbnew/plugins/eagle/Adafruit-AHT20-PCB
          mkdir -p "$DATA/Documents/Import" && cp build/kicad-demos/qa/data/pcbnew/plugins/eagle/Adafruit-AHT20-PCB/*.{sch,brd} "$DATA/Documents/Import/"
          for project in ecc83-pp ecc83-unrouted; do
            mkdir -p "$DATA/Documents/Projects/$project" && cp -R build/kicad-demos/demos/ecc83/. "$DATA/Documents/Projects/$project/"
          done
          for f in "$DATA/Documents/Projects/ecc83-unrouted"/ecc83-pp.*; do mv "$f" "${f/ecc83-pp./ecc83-unrouted.}"; done
          mkdir -p "$DATA/Documents/Projects/erc-roundtrip"
          for e in kicad_pro kicad_sch kicad_pcb; do cp engine/tests/fixtures/roundtrip/RoundTrip.$e "$DATA/Documents/Projects/erc-roundtrip/erc-roundtrip.$e"; done
          python3 - "$DATA/Documents/Projects/ecc83-unrouted/ecc83-unrouted.kicad_pcb" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "integrations/kicad_core/session")
          from board_check import blocks
          board = Path(sys.argv[1]); text = board.read_text(encoding="utf-8")
          for item in list(blocks(text, "segment")) + list(blocks(text, "via")) + list(blocks(text, "arc")):
              text = text.replace(item, "")
          board.write_text(text, encoding="utf-8")
          EOF
          P="$DATA/Documents/Projects/sim-rectifier"; mkdir -p "$P"; cp -R build/kicad-demos/demos/simulation/rectifier/. "$P/"
          mv "$P/rectifier.kicad_pro" "$P/sim-rectifier.kicad_pro"; mv "$P/rectifier.kicad_sch" "$P/sim-rectifier.kicad_sch"
          cp engine/tests/fixtures/sim-rectifier/sim-rectifier.kicad_pcb "$P/"
          # Stop a run through the session, then run again in the same process.
          PROGRAM=native IOS_TARGET=sim bash integrations/kicad_core/probe/ios_link.sh build/kicad-probe build/wx-ios/build-sim \
            build/ios-deps/installed/arm64-ios-simulator "$SIM"
          cp -R "$P" build/sim-stop-project
          build/kicad-probe/corvcad_kicad_native_ios.sim sim-stop "$PWD/build/sim-stop-project/sim-rectifier.kicad_pro" ".tran 1m 100 0 100n" ".tran 1u 10m" \
            | tee build/screens/sim-stop.txt
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/build/screens" xcodebuild test-without-building \
            -project app/CorvCAD.xcodeproj -scheme CorvCAD -destination "id=$SIM" -derivedDataPath build/DerivedData \
            -only-testing:CorvCADUITests/NativeKiCadTests > build/ui-test-native.log 2>&1 \
            || { grep -E 'error|failed|XCTAssert|Skipped' build/ui-test-native.log | head -40; exit 1; }
          grep -E 'Test Case .* (passed|skipped)' build/ui-test-native.log
          grep -q '^stop: 1' build/screens/sim-stop.txt
          [ "$(grep '^run 0:' build/screens/sim-stop.txt | cut -d: -f2-)" = "$(grep '^run 2:' build/screens/sim-stop.txt | cut -d: -f2-)" ]
          ! grep -q 'skipped' build/ui-test-native.log || { echo "a native test was skipped"; exit 1; }
          echo "total build seconds: $(( $(date +%s) - $(cat /tmp/start) ))"
    artifacts:
      - build/screens/*
      - build/ui-test-native.log
      - build/ui-build.log
      - build/configure.log
      - build/kicad-probe/ios_sweep/first_errors.txt

  # Gate 5 desktop proof (the same steps as .circleci/config.yml's native-check job): every
  # candidate built and every closure measured (measure.sh), the native closure linked as
  # objects, KiCad DRC and zone fill compared with kicad-cli 10.0.6 references on eight demo
  # boards, Update PCB from Schematic checked on ecc83, and the inventory's sources recaptured.
  native-check:
    name: KiCad port gate 5 desktop check (macOS)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build/kicad-core
        - $CM_BUILD_DIR/build/ngspice
    scripts:
      - name: Host
        script: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h .
          date +%s > /tmp/start
      - name: Homebrew bottles
        script: |
          PKGS="cmake ninja pkgconf python@3.13 wxwidgets boost glm zstd freetype harfbuzz fontconfig libgit2 protobuf unixodbc cairo pixman"
          brew install $PKGS || true
          brew list --versions $PKGS
      - name: KiCad 10.0.6 source with the patch series, checked against the gate 1 inventory
        script: |
          set -euo pipefail
          [ -d build/kicad-core/kicad ] && python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad \
            || { rm -rf build/kicad-core/kicad; python3 integrations/kicad_core/fetch.py --output build/kicad-core --source-only;
                 python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad; }
      - name: ngspice for macOS (cached)
        script: |
          set -euo pipefail
          [ -f build/ngspice/build-mac/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice mac
      - name: Probe configure
        script: |
          set -euo pipefail
          cmake -G Ninja -S integrations/kicad_core/probe -B build/kicad-probe -DNGSPICE_BUILD="$PWD/build/ngspice" \
            -DKICAD_SOURCE="$PWD/build/kicad-core/kicad" -DCMAKE_BUILD_TYPE=Release > build/configure.log 2>&1 \
            || { tail -40 build/configure.log; exit 1; }
      - name: Build every candidate and measure the closures (measure.sh)
        script: |
          set -uo pipefail
          start=$(date +%s)
          bash integrations/kicad_core/probe/measure.sh build/kicad-probe | tee build/measure.txt
          echo "measure seconds: $(( $(date +%s) - start ))" | tee -a build/measure.txt
          for f in build/kicad-probe/*.unresolved.txt; do [ -s "$f" ] && { echo "== $f"; cat "$f"; }; done
          grep -E -A30 '^FAILED: .*((session|board)_main|headless)' build/kicad-probe/compile.log | grep -E 'FAILED|error' | head -40 || true
          [ -f build/kicad-probe/native.closure.txt ]
      - name: Recapture the inventory's sources
        script: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "integrations/kicad_core")
          import audit
          sources = audit.capture_sources(audit.SourceTree(Path("build/kicad-core/kicad")), Path("build/kicad-probe").resolve())
          Path("build/audit-sources.json").write_text(json.dumps(sources, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print({k: len(v["closure"]) for k, v in sources["profiles"].items()}, len(sources["files"]), "files")
          EOF
      - name: Link the native closure as objects
        script: bash integrations/kicad_core/probe/native_link.sh build/kicad-probe
      - name: KiCad 10.0.6 demo boards
        script: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth 1 --branch 10.0.6 --sparse https://gitlab.com/kicad/code/kicad.git build/kicad-demos
          git -C build/kicad-demos sparse-checkout set demos/ecc83 demos/interf_u demos/complex_hierarchy demos/video \
            demos/stickhub demos/cm5_minima demos/royalblue54L_feather demos/jetson-agx-thor-baseboard
      - name: Native DRC and zone fill against kicad-cli
        script: |
          set -uo pipefail
          export KICAD_CONFIG_HOME="$PWD/build/kicad-config"
          D=build/kicad-demos/demos
          python3 integrations/kicad_core/session/board_check.py compare integrations/kicad_core/session/board_reference.json \
            build/kicad-probe/corvcad_kicad_native $D/ecc83/ecc83-pp.kicad_pcb $D/interf_u/interf_u.kicad_pcb \
            $D/complex_hierarchy/complex_hierarchy.kicad_pcb $D/video/video.kicad_pcb $D/stickhub/StickHub.kicad_pcb \
            $D/cm5_minima/CM5_MINIMA_3.kicad_pcb $D/royalblue54L_feather/RoyalBlue54L-Feather.kicad_pcb \
            $D/jetson-agx-thor-baseboard/jetson-agx-thor-baseboard.kicad_pcb \
            engine/tests/fixtures/drawn/Drawn.kicad_pcb | tee build/board_check.txt
      - name: Native Update PCB from Schematic (ecc83 without U1, kicad-cli's netlist)
        script: |
          set -uo pipefail
          export KICAD_CONFIG_HOME="$PWD/build/kicad-config"
          python3 integrations/kicad_core/session/board_check.py update build/kicad-probe/corvcad_kicad_native \
            build/kicad-demos/demos/ecc83/ecc83-pp.kicad_pcb integrations/kicad_core/session/ecc83-pp.net U1 \
            | tee build/board_update.txt
          status=$?
          # The ratsnest with real edges: ecc83 without its tracks, 14 unconnected items in kicad-cli 10.0.6.
          python3 integrations/kicad_core/session/board_check.py ratsnest build/kicad-probe/corvcad_kicad_native \
            build/kicad-demos/demos/ecc83/ecc83-pp.kicad_pcb 14 | tee build/ratsnest.txt || status=1
          # A library symbol placed through the session (API 5) appears in KiCad's netlist.
          build/kicad-probe/corvcad_kicad_native symbol build/kicad-demos/demos/ecc83/ecc83-pp.kicad_pro ecc83-pp:R \
            | tee build/symbol_place.txt || status=1
          # The board session keeps the open board until its file changes.
          # KiCad's router on ecc83 without tracks: every ratsnest edge, checked with KiCad's DRC.
          python3 integrations/kicad_core/session/board_check.py route build/kicad-probe/corvcad_kicad_native \
            build/kicad-demos/demos/ecc83/ecc83-pp.kicad_pcb | tee build/board_route.txt || status=1
          # A differential pair (USB D+/D-) on StickHub without tracks.
          python3 integrations/kicad_core/session/board_check.py route build/kicad-probe/corvcad_kicad_native \
            build/kicad-demos/demos/stickhub/StickHub.kicad_pcb /U1D+ | tee -a build/board_route.txt || status=1
          # Free-space routes on a board without nets, as the app's finger drives them: no acute
          # corners, near-miss track ends or slivers (the spike seen on the iPad, 2026-10-25).
          build/kicad-probe/corvcad_kicad_native spike engine/tests/fixtures/roundtrip/RoundTrip.kicad_pcb "$(mktemp -d)" \
            | tee build/board_spike.txt || status=1
          # Fabrication outputs (Gerbers, job file, drill, placement) against kicad-cli 10.0.6's;
          # Drawn is the engine's drawing calls (outline, zones, silkscreen line, text).
          D=build/kicad-demos/demos
          python3 integrations/kicad_core/session/board_check.py fab integrations/kicad_core/session/fab_reference.json \
            build/kicad-probe/corvcad_kicad_native --keep=build/fab $D/ecc83/ecc83-pp.kicad_pcb $D/interf_u/interf_u.kicad_pcb \
            $D/video/video.kicad_pcb $D/complex_hierarchy/complex_hierarchy.kicad_pcb $D/stickhub/StickHub.kicad_pcb \
            engine/tests/fixtures/roundtrip/RoundTrip.kicad_pcb engine/tests/fixtures/drawn/Drawn.kicad_pcb \
            | tee build/board_fab.txt || status=1
          # PDF (a page per layer) and SVG plots of the same layers.
          python3 integrations/kicad_core/session/board_check.py plot build/kicad-probe/corvcad_kicad_native \
            $D/ecc83/ecc83-pp.kicad_pcb $D/stickhub/StickHub.kicad_pcb | tee -a build/board_fab.txt || status=1
          # Board Setup round trip (4 layers, a rule, a netclass and a pattern) read back and DRC-checked.
          python3 integrations/kicad_core/session/board_check.py setup build/kicad-probe/corvcad_kicad_native \
            $D/ecc83/ecc83-pp.kicad_pcb | tee build/board_setup.txt || status=1
          # Schematic tools (annotate, sheet, sheet pin, bus, bus entry, scoped labels) and the BOM
          # against kicad-cli 10.0.6's.
          python3 integrations/kicad_core/session/board_check.py schematic build/kicad-probe/corvcad_kicad_native \
            integrations/kicad_core/session/bom_reference.json $D/ecc83/ecc83-pp.kicad_pro \
            $D/complex_hierarchy/complex_hierarchy.kicad_pro $D/video/video.kicad_pro | tee build/schematic_tools.txt || status=1
          # Two projects in one process, as the app opens them: each sees its own library tables.
          python3 integrations/kicad_core/session/board_check.py projects build/kicad-probe/corvcad_kicad_native \
            $D/ecc83/ecc83-pp.kicad_pro $D/complex_hierarchy/complex_hierarchy.kicad_pro | tee build/project_switch.txt || status=1
          # Project libraries: the engine test's generated CorvLib (symbols and footprints) in a
          # project whose tables lack it; the tables arrive as an import writes them, KiCad reloads
          # them, places the symbols and adds their footprints through Update PCB.
          cmake -G Ninja -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/engine --target corvcad_library_tests > /dev/null
          mkdir -p build/library
          CORVCAD_TEST_LIBRARY_OUTPUT="$PWD/build/library/Library" build/engine/corvcad_library_tests || status=1
          L=$(mktemp -d); cp -R build/library/Library "$L/"; mkdir "$L/tables"
          mv "$L/Library/sym-lib-table" "$L/Library/fp-lib-table" "$L/tables/"
          grep -v CorvLib "$L/tables/sym-lib-table" > "$L/Library/sym-lib-table"
          grep -v CorvLib "$L/tables/fp-lib-table" > "$L/Library/fp-lib-table"
          build/kicad-probe/corvcad_kicad_native library "$L/Library/Library.kicad_pro" "$L/tables" \
            | tee build/library_check.txt || status=1
          for b in ecc83/ecc83-pp video/video; do
            build/kicad-probe/corvcad_kicad_native session build/kicad-demos/demos/$b.kicad_pcb "$(mktemp -d)" \
              | tee -a build/board_session.txt || status=1
          done
          echo "total build seconds: $(( $(date +%s) - $(cat /tmp/start) ))"
          exit $status
    artifacts:
      - build/audit-sources.json
      - build/measure.txt
      - build/board_check.txt
      - build/board_update.txt
      - build/symbol_place.txt
      - build/ratsnest.txt
      - build/board_route.txt
      - build/board_spike.txt
      - build/board_fab.txt
      - build/fab
      - build/board_setup.txt
      - build/schematic_tools.txt
      - build/library_check.txt
      - build/library
      - build/kicad-probe/native.link.log
      - build/kicad-probe/native.compile.log

  # The 3D part generator on desktop OCCT (Homebrew's bottle): every table row builds valid,
  # deterministic solids, and a sample matches KiCad 10's official STEP models (docs/3D_MODELS.md
  # gate 2). Either account; normally the KiCad one.
  parts3d:
    name: 3D part generator (desktop OCCT)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
    scripts:
      - name: OCCT from Homebrew
        script: brew install opencascade && brew list --versions opencascade
      - name: Build and check the generator
        script: |
          set -euo pipefail
          cmake -S integrations/parts3d -B build/parts3d -DCMAKE_BUILD_TYPE=Release \
            -DOpenCASCADE_DIR="$(brew --prefix opencascade)/lib/cmake/opencascade" > build-parts3d.log
          cmake --build build/parts3d -j "$(sysctl -n hw.ncpu)" >> build-parts3d.log 2>&1 || { grep -E 'error' build-parts3d.log | head -30; exit 1; }
          mkdir -p build/parts3d-out
          status=0
          build/parts3d/parts3d_check all | tee build/parts3d-out/all.txt || status=1
          build/parts3d/parts3d_check compare build/parts3d-ref $(bash integrations/parts3d/references.sh build/parts3d-ref) \
            | tee build/parts3d-out/compare.txt || status=1
          exit $status
    artifacts:
      - build/parts3d-out/*
      - build-parts3d.log