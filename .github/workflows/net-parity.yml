name: Schematic net parity with KiCad
# Builds and tests the engine, then compares its portable schematic connectivity with
# kicad-cli netlists (KiCad 10 from the official PPA) on KiCad's demo projects and the
# repository fixtures. Results are pushed to the ci/net-parity branch.
# Manual only (owner's decision 2026-10-24): nothing runs on push, pull request or tag.
# Start it from the Actions tab or the workflow_dispatch API.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10 and demos
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-demos
      - name: Build, test and compare
        continue-on-error: true
        run: |
          mkdir -p out
          set -o pipefail
          { cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release && cmake --build build/engine --parallel \
            && ctest --test-dir build/engine --output-on-failure; } 2>&1 | tee out/engine.log | tail -30
          kicad-cli version > out/kicad-version.txt
          python3 integrations/kicad_cli/net_parity.py build/engine/corvcad_eda_cli \
            /usr/share/kicad/demos engine/tests/fixtures 2>&1 | tee out/parity.log | tail -40
      - name: Push results to ci/net-parity
        run: |
          echo "commit ${GITHUB_SHA}" > out/STATUS
          git config user.name "corvcad-ci"
          git config user.email "corvcad-ci@users.noreply.github.com"
          git checkout --orphan ci/net-parity
          git rm -rq --cached .
          git add -f out
          git commit -qm "Net parity run for ${GITHUB_SHA}"
          git push -f origin HEAD:refs/heads/ci/net-parity
