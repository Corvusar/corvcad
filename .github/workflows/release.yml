name: Release

# The native editions' unsigned device IPAs with their complete corresponding source, as a DRAFT
# GitHub release for a maintainer to review and publish. Manual only. Each edition is
# GPL-3.0-or-later as a whole; its source archive holds CorvCAD at this commit, the pinned upstream
# sources and every dependency source archive the build downloaded (see each release_native.sh).
# A cold run builds all dependencies from source; they are cached together with their downloaded
# source archives, never as binaries alone, so a later run's source set stays complete.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0 (tag v<version>, the app's version)
        required: true
      editions:
        description: Which editions to build (kicad, freecad or both)
        default: both
      runner:
        description: macOS runner label (arm64)
        default: macos-26
      xcode:
        description: Xcode version to select (falls back to the newest 26.x)
        default: "26.2"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  VERSION: ${{ inputs.version }}

jobs:
  kicad:
    name: KiCad edition (device)
    if: inputs.editions != 'freecad'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - &tools
        name: Xcode and host tools
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be x.y.z"; exit 1; }
          X=$(ls -d /Applications/Xcode_${{ inputs.xcode }}*.app 2>/dev/null | head -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version; uname -m; sysctl -n hw.ncpu hw.memsize
          rm -rf ~/Library/Android; df -h .
          brew install cmake ninja xcodegen pkgconf autoconf autoconf-archive automake libtool bison flex ccache swig \
            wxwidgets boost glm zstd freetype harfbuzz fontconfig libgit2 protobuf unixodbc cairo pixman || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"; echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v4
        with:
          path: &kicad-cache |
            build/kicad-core
            build/ngspice
            build/wx-ios
            build/ios-deps
            !build/ios-deps/vcpkg/buildtrees
            !build/ios-deps/vcpkg/packages
          key: release-kicad-device-${{ hashFiles('integrations/kicad_core/upstream.json', 'integrations/kicad_core/patches/*.patch', 'integrations/kicad_core/*.sh', 'integrations/kicad_core/triplets/*', 'integrations/kicad_core/fetch.py') }}

      - name: KiCad 10.0.6 source with the patch series, checked against the gate 1 inventory
        run: |
          [ -d build/kicad-core/kicad ] && python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad \
            || { rm -rf build/kicad-core/kicad; python3 integrations/kicad_core/fetch.py --output build/kicad-core --source-only;
                 python3 integrations/kicad_core/audit.py verify --kicad build/kicad-core/kicad; }

      - name: ngspice, wxWidgets, vcpkg dependencies and KiCad's libraries for the device (cached)
        run: |
          [ -f build/ngspice/build-mac/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice mac
          [ -f build/ngspice/build-device/libngspice.a ] || bash integrations/kicad_core/ngspice_ios.sh build/ngspice device
          [ -x build/wx-ios/build-device/wx-config ] || bash integrations/kicad_core/wx_ios.sh build/wx-ios device
          for attempt in 1 2 3 4 5; do   # GitHub's source archives can fail with 504; vcpkg resumes
            bash integrations/kicad_core/ios_deps.sh build/ios-deps arm64-ios && break
            [ $attempt = 5 ] && exit 1; echo "attempt $attempt failed"; sleep 60
          done
          [ -f build/kicad-core/footprints-packed/index.json ] && [ -f build/kicad-core/symbols-packed/index.json ] \
            && [ -f build/kicad-core/symbols-packed/Simulation_SPICE.sp ] \
            || python3 integrations/kicad_core/fetch.py --output build/kicad-core --libraries-only

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: *kicad-cache
          key: release-kicad-device-${{ hashFiles('integrations/kicad_core/upstream.json', 'integrations/kicad_core/patches/*.patch', 'integrations/kicad_core/*.sh', 'integrations/kicad_core/triplets/*', 'integrations/kicad_core/fetch.py') }}

      - name: Compile KiCad's closures for the device
        run: |
          cmake -G Ninja -S integrations/kicad_core/probe -B build/kicad-probe -DNGSPICE_BUILD="$PWD/build/ngspice" \
            -DKICAD_SOURCE="$PWD/build/kicad-core/kicad" -DCMAKE_BUILD_TYPE=Release > build/configure.log 2>&1 \
            || { tail -40 build/configure.log; exit 1; }
          python3 - "$PWD" <<'EOF'
          import json, sys
          repo = sys.argv[1].lstrip("/")
          profiles = json.load(open("integrations/kicad_core/audit/sources.json"))["profiles"]
          def unit(path):
              head, _, rest = path.partition("/")
              return {"kicad": rest, "generated": path, "corvcad": f"{repo}/{rest}"}[head]
          for profile, name in (("schematic", "probe_headless"), ("session", "session"), ("board", "pcb_probe_headless"), ("native", "native")):
              with open(f"build/kicad-probe/{name}.closure.txt", "w") as out:
                  out.write("\n".join(sorted(unit(p) for p in profiles[profile]["closure"])) + "\n")
          EOF
          IOS_TARGET=device bash integrations/kicad_core/probe/ios_sweep.sh build/kicad-probe \
            build/wx-ios/build-device "$(sysctl -n hw.ncpu)" build/ios-deps/installed/arm64-ios || true  # failed.txt decides
          [ ! -f build/kicad-probe/ios_sweep-device/failed.txt ] || { cat build/kicad-probe/ios_sweep-device/first_errors.txt; exit 1; }

      - name: Unsigned IPA and corresponding source
        run: |
          python3 integrations/kicad_core/fetch.py --output build/kicad-release --source-only --full-source
          bash integrations/kicad_core/release_native.sh . build build/kicad-release/kicad build/release-kicad

      - uses: actions/upload-artifact@v4
        with:
          name: release-kicad
          path: |
            build/release-kicad/*.ipa
            build/release-kicad/source
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-kicad-logs
          path: |
            build/*.log
            build/release-kicad/xcodebuild.log
            build/kicad-probe/ios_sweep-device/first_errors.txt

  freecad:
    name: FreeCAD edition (device)
    if: inputs.editions != 'kicad'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - *tools

      - name: Build caches
        run: |
          echo "CCACHE_DIR=$PWD/build/freecad-ios/ccache-ios" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/build/freecad-ios/binary-cache,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_DOWNLOADS=$PWD/build/freecad-ios/vcpkg-downloads" >> "$GITHUB_ENV"
          mkdir -p build/freecad-ios/binary-cache build/freecad-ios/ccache-ios build/freecad-ios/vcpkg-downloads

      # The binary cache only ever travels with the dependency source archives it was built from.
      - uses: actions/cache/restore@v4
        with:
          path: &freecad-cache |
            build/freecad-ios/binary-cache
            build/freecad-ios/vcpkg-downloads
            build/freecad-ios/ccache-ios
            build/freecad-ios/python/Python-3.13.7.tar.xz
            build/freecad-ios/python/host
            build/freecad-ios/occt/OCCT-V7_8_1.tar.gz
          key: release-freecad-device-${{ github.run_id }}
          restore-keys: release-freecad-device-

      - name: FreeCAD's static iOS dependencies, CPython and OCCT for the device
        run: |
          for attempt in 1 2 3; do
            bash integrations/freecad_core/ios/deps.sh build/freecad-ios/deps arm64-ios > build/dependencies-build.log 2>&1 && break
            [ $attempt = 3 ] && { tail -100 build/dependencies-build.log; exit 1; }; echo "attempt $attempt failed"; sleep 60
          done
          python3 integrations/freecad_core/ios/dependency_inventory.py build/freecad-ios/deps/installed arm64-ios \
            build/freecad-ios/deps/inventory-arm64-ios.json --verify-target
          python3 integrations/freecad_core/ios/build_python.py --sdk iphoneos \
            --deps build/freecad-ios/deps/installed/arm64-ios --jobs 3 > build/python-build.log 2>&1 \
            || { tail -100 build/python-build.log; exit 1; }
          python3 integrations/freecad_core/ios/build_occt.py --sdk iphoneos --jobs 3 > build/occt-build.log 2>&1 \
            || { tail -100 build/occt-build.log; exit 1; }

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: *freecad-cache
          key: release-freecad-device-${{ github.run_id }}

      - name: FreeCAD session, runtime and package for the device
        run: |
          python3 integrations/freecad_core/session/build.py --sdk iphoneos --jobs 3 > build/freecad-ios-build.log 2>&1 \
            || { tail -120 build/freecad-ios-build.log; exit 1; }
          python3 integrations/freecad_core/ios/stage_runtime.py \
            --source build/freecad-ios/source-ios/FreeCAD \
            --build build/freecad-ios/freecad-iphoneos \
            --python-stage build/freecad-ios/python/iphoneos/stage \
            --host-python build/freecad-ios/python/host/python.exe \
            --output build/freecad-ios/runtime-iphoneos \
            --dependency-notices build/freecad-ios/deps/installed/arm64-ios/share \
            --dependency-notices build/freecad-ios/occt/iphoneos/stage/share/occt
          python3 integrations/freecad_core/session/package.py --sdk iphoneos --output build/freecad-ios/package/device

      - name: Unsigned IPA and corresponding source
        run: bash integrations/freecad_core/release_native.sh . build/freecad-ios build/release-freecad

      - uses: actions/upload-artifact@v4
        with:
          name: release-freecad
          path: |
            build/release-freecad/*.ipa
            build/release-freecad/source
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-freecad-logs
          path: |
            build/*.log
            build/release-freecad/xcodebuild.log

  draft:
    name: Draft release
    needs: [kicad, freecad]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Pack each edition's source and create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets
          for edition in kicad freecad; do
            dir=artifacts/release-$edition
            [ -d "$dir" ] || continue
            name=$( [ $edition = kicad ] && echo KiCad || echo FreeCAD )
            cp "$dir"/*.ipa assets/
            (cd "$dir/source" && sha256sum -c SHA256SUMS)   # the source set arrived intact
            tar -cf "assets/CorvCAD-$name-$VERSION-source.tar" -C "$dir" --transform "s|^source|CorvCAD-$name-$VERSION-source|" source
          done
          (cd assets && sha256sum * > SHA256SUMS.txt && ls -l)
          cat > notes.md <<EOF
          **Draft, not yet reviewed.** Unsigned iPad builds of CorvCAD $VERSION, built from ${GITHUB_SHA}.

          | File | Edition |
          |---|---|
          | \`CorvCAD-KiCad-$VERSION-unsigned.ipa\` | KiCad edition: KiCad 10.0.6's schematic and board engines, DRC, ERC, router, simulator, fabrication outputs |
          | \`CorvCAD-FreeCAD-$VERSION-unsigned.ipa\` | FreeCAD edition: FreeCAD 1.1.4's enclosure modeller, STEP export, generated 3D parts |

          Each edition is GPL-3.0-or-later as a whole. Its \`-source.tar\` holds the complete corresponding
          source for that IPA: CorvCAD at this commit, the pinned upstream sources and every dependency's
          source archive, with a README giving the build order and SHA256SUMS. \`SHA256SUMS.txt\` covers
          the release files.

          The IPAs are unsigned: install them with your own signing, for example through LiveContainer or
          AltStore/SideStore (see the README). CorvCAD is not affiliated with the KiCad or FreeCAD projects.
          EOF
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            # A rerun refreshes its own unpublished draft; a published release is never touched.
            gh release upload "v$VERSION" assets/* --clobber
            gh release edit "v$VERSION" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "v$VERSION" assets/* --draft --target "$GITHUB_SHA" --title "CorvCAD $VERSION" --notes-file notes.md
          fi
